// ============================================================
//  AUDIO

let audioCtx;
let ambOscs = []; // ambient music oscillators
let ambLFO = null;
let ambGains = [];

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, type, dur, vol = 0.25) {
    if (!audioCtx) return;
    try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}

function startAmbient() {
    if (!audioCtx) return;
    stopAmbient();
    try {
        // LFO for pitch modulation
        ambLFO = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        ambLFO.frequency.value = 0.15;
        ambLFO.type = 'sine';
        lfoGain.gain.value = 1.5;
        ambLFO.connect(lfoGain);
        ambLFO.start();

        const configs = [
            { freq: 55,   type: 'sine',     vol: 0.06 },
            { freq: 82.5, type: 'triangle', vol: 0.03 },
            { freq: 110,  type: 'sine',     vol: 0.02 },
        ];
        for (let cfg of configs) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = cfg.type;
            osc.frequency.value = cfg.freq;
            gain.gain.value = cfg.vol;
            lfoGain.connect(osc.frequency);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            ambOscs.push(osc);
            ambGains.push(gain);
        }
    } catch(e) {}
}

function stopAmbient() {
    try {
        for (let o of ambOscs) { try { o.stop(); } catch(e){} }
        if (ambLFO) { try { ambLFO.stop(); } catch(e){} }
    } catch(e) {}
    ambOscs = []; ambGains = []; ambLFO = null;
}

function pauseAmbient() {
    for (let g of ambGains) { try { g.gain.value = 0; } catch(e){} }
}
function resumeAmbient() {
    const vols = [0.06, 0.03, 0.02];
    ambGains.forEach((g, i) => { try { g.gain.value = vols[i]; } catch(e){} });
}

// ============================================================
//  MAP GENERATION
// ============================================================
function genMap() {
    map = [];
    for (let y = 0; y < MAP_H; y++) {
        map[y] = [];
        for (let x = 0; x < MAP_W; x++) {
            map[y][x] = (x===0||y===0||x===MAP_W-1||y===MAP_H-1) ? 1 : 0;
        }
    }
    for (let i = 0; i < 45; i++) {
        let tx = 3 + Math.floor(Math.random()*(MAP_W-6));
        let ty = 3 + Math.floor(Math.random()*(MAP_H-6));
        let cx = MAP_W/2, cy = MAP_H/2;
        if (Math.abs(tx-cx)>5 || Math.abs(ty-cy)>5) map[ty][tx] = 2;
    }
    for (let i = 0; i < 22; i++) {
        let tx = 2 + Math.floor(Math.random()*(MAP_W-4));
        let ty = 2 + Math.floor(Math.random()*(MAP_H-4));
        if (Math.abs(tx-MAP_W/2)>4 || Math.abs(ty-MAP_H/2)>4) map[ty][tx] = 3;
    }
}

function solid(tx, ty) {
    if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return true;
    return map[ty][tx]===1 || map[ty][tx]===2;
}
function solidW(wx, wy) { return solid(Math.floor(wx/TILE), Math.floor(wy/TILE)); }

//  TILE DRAWING
// ============================================================
const FLOOR_C  = ['#251926','#201520','#2a1d2e'];
const WALL_C   = ['#4a3858','#3d2e4a','#543f64'];
const PILLAR_C = ['#5e4c70','#4e3d5e'];

function drawTiles() {
    let tx0 = Math.max(0, Math.floor(camX/TILE));
    let ty0 = Math.max(0, Math.floor(camY/TILE));
    let tx1 = Math.min(MAP_W, tx0+Math.ceil(W/TILE)+2);
    let ty1 = Math.min(MAP_H, ty0+Math.ceil(H/TILE)+2);
    for (let ty=ty0; ty<ty1; ty++) {
        for (let tx=tx0; tx<tx1; tx++) {
            let t = map[ty][tx];
            let wx = tx*TILE-camX, wy = ty*TILE-camY;
            if (t===1) {
                ctx.fillStyle=WALL_C[0]; ctx.fillRect(wx,wy,TILE,TILE);
                ctx.fillStyle=WALL_C[2]; ctx.fillRect(wx,wy,TILE,5);
                ctx.fillStyle='#1a0e22';
                ctx.fillRect(wx+4,wy+9,TILE-8,4);
                ctx.fillRect(wx+4,wy+22,TILE-8,4);
            } else {
                let ci=(tx+ty)%3;
                ctx.fillStyle=FLOOR_C[ci]; ctx.fillRect(wx,wy,TILE,TILE);
                if ((tx+ty)%4===0) {
                    ctx.fillStyle='#34264a'; ctx.fillRect(wx+2,wy+2,TILE-4,TILE-4);
                }
                if (t===2) {
                    ctx.fillStyle=PILLAR_C[0]; ctx.fillRect(wx+7,wy+5,TILE-14,TILE-5);
                    ctx.fillStyle=PILLAR_C[1]; ctx.fillRect(wx+7,wy+5,TILE-14,6);
                    ctx.fillStyle='#7c68a0'; ctx.fillRect(wx+10,wy+8,3,TILE-14);
                }
                if (t===3) {
                    ctx.fillStyle='#48485a'; ctx.fillRect(wx+17,wy+10,7,26);
                    ctx.fillStyle='#38384a'; ctx.fillRect(wx+10,wy+14,21,6);
                    ctx.fillStyle='#28283a'; ctx.fillRect(wx+16,wy+9,2,22);
                }
            }
        }
    }
}

function drawPlayer() {
    let sx = P.x-camX, sy = P.y-camY;
    if (P.iframes>0 && Math.floor(P.iframes*12)%2===0) return;
    ctx.save(); ctx.translate(sx, sy);
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.ellipse(0,P.h/2-3,13,5,0,0,Math.PI*2); ctx.fill();
    // Draw class sprite
    switch(P.cls) {
        case 'mage':   drawMage();   break;
        case 'archer': drawArcher(); break;
        default:       drawKnight(); break;
    }
    ctx.restore();
}

//  DRAW — ENEMIES
// ============================================================
function drawEnemy(e) {
    let sx = e.x-camX, sy = e.y-camY;
    if (sx<-60||sy<-70||sx>W+60||sy>H+70) return;
    ctx.save(); ctx.translate(sx, sy);
    if (e.flash>0) { ctx.filter='brightness(4)'; ctx.globalAlpha=0.85; }
    ctx.filter='none';
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0,e.h/2-2,e.w/2-1,4,0,0,Math.PI*2); ctx.fill();
    if (e.flash>0) ctx.filter='brightness(4)';
    // Stun indicator
    if (e.stunned>0) {
        ctx.filter='none'; ctx.fillStyle='#ffff00';
        ctx.font='14px sans-serif'; ctx.textAlign='center';
        ctx.fillText('⭐',0,-e.h/2-14);
        if (e.flash>0) ctx.filter='brightness(4)';
    }
    // Slow indicator
    if (e.slowed>0 && e.stunned<=0) {
        ctx.filter='none'; ctx.globalAlpha=0.7;
        ctx.fillStyle='#88ccff'; ctx.beginPath(); ctx.arc(0,-e.h/2-12,6,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
        if (e.flash>0) ctx.filter='brightness(4)';
    }
    switch(e.type) {
        case 'zombie':   drawZombie(e);   break;
        case 'ghoul':    drawGhoul(e);    break;
        case 'skeleton': drawSkeleton(e); break;
        case 'archer':   drawArcher_e(e); break;
        case 'boss':     drawBoss(e);     break;
    }
    ctx.filter='none'; ctx.globalAlpha=1;
    ctx.restore();
    // HP bar
    let bw = e.type==='boss' ? 70 : 36;
    let bx = sx-bw/2, by = sy-e.h/2-11;
    ctx.fillStyle='#300'; ctx.fillRect(bx,by,bw,5);
    ctx.fillStyle = e.type==='boss' ? '#ff6600' : '#ee2244';
    ctx.fillRect(bx,by,bw*Math.max(0,e.hp/e.maxHp),5);
    if (e.type==='boss') {
        ctx.fillStyle='#ffaa00'; ctx.font='bold 11px sans-serif';
        ctx.textAlign='center'; ctx.fillText(e.name,sx,by-2);
    }
}

const ETYPE = {
    zombie:   { hp:65,  atk:9,  spd:55,  exp:15, pts:10,  w:28, h:36, name:'Zombie',        ranged:false },
    ghoul:    { hp:95,  atk:15, spd:88,  exp:28, pts:22,  w:28, h:36, name:'Ghoul',         ranged:false },
    skeleton: { hp:55,  atk:11, spd:105, exp:22, pts:20,  w:26, h:36, name:'Skeleton',      ranged:false },
    archer:   { hp:75,  atk:20, spd:62,  exp:32, pts:28,  w:26, h:36, name:'Zombie Archer', ranged:true, rDist:220, rCD:2.5 },
    boss:     { hp:900, atk:38, spd:52,  exp:220,pts:600, w:52, h:60, name:'Undead Lord',   ranged:false },
};

// ============================================================
//  SPAWNING
// ============================================================
function pickType(w) {
    let r=Math.random();
    if (w<2) return 'zombie';
    if (w<4) return r<0.55?'zombie':'ghoul';
    if (w<6) return r<0.35?'zombie':r<0.65?'ghoul':'skeleton';
    if (r<0.28) return 'zombie';
    if (r<0.52) return 'ghoul';
    if (r<0.72) return 'skeleton';
    return 'archer';
}

function getSpawnSide() {
    // Smart spawn: 70% from opposite side of player, 30% random
    if (Math.random() < 0.7) {
        // determine player's quadrant
        let px = P.x / (MAP_W * TILE);
        let py = P.y / (MAP_H * TILE);
        // pick opposite side
        if (px < 0.33) return 1; // player left -> spawn right
        if (px > 0.67) return 3; // player right -> spawn left
        if (py < 0.33) return 2; // player top -> spawn bottom
        if (py > 0.67) return 0; // player bottom -> spawn top
        // center — pick farthest side
        let dists = [py, 1-px, 1-py, px];
        return dists.indexOf(Math.max(...dists));
    }
    return Math.floor(Math.random()*4);
}

function spawnEnemy(type) {
    let cfg = ETYPE[type];
    let side = getSpawnSide();
    let x, y, m=2;
    if (side===0) { x=(m+Math.random()*(MAP_W-m*2))*TILE; y=m*TILE; }
    else if(side===1){ x=(MAP_W-m)*TILE; y=(m+Math.random()*(MAP_H-m*2))*TILE; }
    else if(side===2){ x=(m+Math.random()*(MAP_W-m*2))*TILE; y=(MAP_H-m)*TILE; }
    else { x=m*TILE; y=(m+Math.random()*(MAP_H-m*2))*TILE; }

    let scale = 1+(wave-1)*0.11;
    enemies.push({
        type, x, y, w:cfg.w, h:cfg.h, name:cfg.name,
        hp:Math.floor(cfg.hp*scale), maxHp:Math.floor(cfg.hp*scale),
        atk:Math.floor(cfg.atk*scale), spd:cfg.spd,
        exp:cfg.exp, pts:cfg.pts,
        atkCD:0, flash:0,
        ranged:cfg.ranged, rDist:cfg.rDist||0, rCD:cfg.rCD||0, shootCD:cfg.rCD||0,
        stunned:0, slowed:0,
    });
}

function spawnWave(w) {
    let count = 8+w*4;
    waveLeft = count;
    if (w%5===0) { spawnEnemy('boss'); count--; }
    for (let i=0; i<count; i++) {
        setTimeout(() => { if(state===ST.PLAY) spawnEnemy(pickType(w)); }, i*280+500);
    }
}

function getWaveEnemyTypes(w) {
    let types = new Set();
    if (w%5===0) types.add('Undead Lord');
    let count = 8+w*4;
    for (let i=0; i<Math.min(count,8); i++) {
        let t = pickType(w);
        types.add(ETYPE[t].name);
    }
    return [...types];
}

// ============================================================
//  COMBAT
// ============================================================
function doAttack() {
    if (P.atkCD>0 || P.dead) return;
    P.atkCD = Math.max(0.25, 0.55-P.lv*0.012);
    playSound(200,'square',0.07,0.18);
    let hit=false;
    for (let e of enemies) {
        if (e.hp<=0) continue;
        let d=dist(P.x,P.y,e.x,e.y);
        if (d < P.atkRange+e.w/2) {
            let dmg = P.atk+Math.floor(Math.random()*12);
            let crit = Math.random()<P.crit;
            if (crit) dmg=Math.floor(dmg*1.85);
            e.hp-=dmg; e.flash=0.12;
            addParts(e.x,e.y,crit?'#ffcc00':'#ff3344',crit?10:5);
            addFloat(e.x,e.y-15,dmg,crit?'#ffcc00':'#ffffff',crit?20:15);
            hit=true;
            if (e.hp<=0) killEnemy(e);
        }
    }
    if (hit) addParts(P.x+25,P.y-5,'#aaddff',3);
}

function doSkill1() {
    let cls = CLASSES[P.cls];
    if (P.s1CD>0 || P.mp<cls.s1mp || P.dead) return;
    P.s1CD = P.s1BaseCd; P.mp -= cls.s1mp;
    playSound(440,'sawtooth',0.18,0.35);
    setTimeout(()=>playSound(660,'sine',0.2,0.3),80);

    if (P.cls==='knight') {
        // Holy Cross: AoE around player
        let r=140;
        for (let e of enemies) {
            if (e.hp<=0) continue;
            if (dist(P.x,P.y,e.x,e.y)<r) {
                let dmg=Math.floor(P.atk*2.6+Math.random()*22);
                e.hp-=dmg; e.flash=0.22;
                addParts(e.x,e.y,'#ffdd00',14);
                addFloat(e.x,e.y-20,dmg,'#ffdd00',22);
                if (e.hp<=0) killEnemy(e);
            }
        }
        addParts(P.x,P.y,'#ffff00',30); addParts(P.x,P.y,'#ffffff',18); addParts(P.x,P.y,'#ff8800',12);
    } else if (P.cls==='mage') {
        // Nova Burst: large AoE
        let r=180;
        for (let e of enemies) {
            if (e.hp<=0) continue;
            if (dist(P.x,P.y,e.x,e.y)<r) {
                let dmg=Math.floor(P.atk*3.0+Math.random()*30);
                e.hp-=dmg; e.flash=0.25;
                addParts(e.x,e.y,'#aa44ff',16);
                addFloat(e.x,e.y-20,dmg,'#cc88ff',22);
                if (e.hp<=0) killEnemy(e);
            }
        }
        addParts(P.x,P.y,'#9900ff',40); addParts(P.x,P.y,'#cc88ff',20);
    } else if (P.cls==='archer') {
        // Arrow Rain: fire 8 arrows in all directions
        for (let i=0; i<8; i++) {
            let a = (i/8)*Math.PI*2;
            bullets.push({ x:P.x, y:P.y, vx:Math.cos(a)*200, vy:Math.sin(a)*200,
                dmg:Math.floor(P.atk*1.5), life:1.5, enemy:false, color:'#88ff44', pierce:false, hitList:[] });
        }
        addParts(P.x,P.y,'#88ff44',20);
    }
}

function doSkill2() {
    if (P.lv < 5) return;
    let cls = CLASSES[P.cls];
    if (P.s2CD>0 || P.mp<cls.s2mp || P.dead) return;
    P.s2CD = P.s2BaseCd; P.mp -= cls.s2mp;
    playSound(330,'square',0.12,0.3);

    if (P.cls==='knight') {
        // Bash: stun + dmg nearest enemy
        let near=null, nearD=9999;
        for (let e of enemies) {
            if (e.hp<=0) continue;
            let d=dist(P.x,P.y,e.x,e.y);
            if (d<nearD) { nearD=d; near=e; }
        }
        if (near) {
            let dmg=P.atk*4;
            near.hp-=dmg; near.flash=0.3; near.stunned=2.5;
            addParts(near.x,near.y,'#ffaa00',20);
            addFloat(near.x,near.y-20,dmg,'#ffaa00',24);
            playSound(120,'sawtooth',0.3,0.4);
            if (near.hp<=0) killEnemy(near);
        }
    } else if (P.cls==='mage') {
        // Frost Nova: slow all enemies within range
        let r=200;
        for (let e of enemies) {
            if (e.hp<=0) continue;
            if (dist(P.x,P.y,e.x,e.y)<r) {
                e.slowed=3.0;
                addParts(e.x,e.y,'#88ccff',8);
            }
        }
        addParts(P.x,P.y,'#88ccff',35);
        playSound(550,'sine',0.25,0.3);
    } else if (P.cls==='archer') {
        // Pierce Shot: bullet in joystick direction
        let dx=joy.dx||0, dy=joy.dy||0;
        let len=Math.sqrt(dx*dx+dy*dy);
        if (len<0.1) { dx=1; dy=0; } else { dx/=len; dy/=len; }
        bullets.push({ x:P.x, y:P.y, vx:dx*280, vy:dy*280,
            dmg:Math.floor(P.atk*2.5), life:2.5, enemy:false, color:'#ffee00', pierce:true, hitList:[] });
        addParts(P.x,P.y,'#ffee00',12);
        playSound(380,'sawtooth',0.1,0.2);
    }
}

function killEnemy(e) {
    e.hp=0;
    totalKills++; score+=e.pts;
    P.exp+=e.exp;
    if (P.exp>=P.nextExp) levelUp();
    playSound(95,'sawtooth',0.18,0.25);
    addParts(e.x,e.y,'#664422',8);
    // HP drop scales with wave
    let dropChance = Math.min(0.45, 0.15+wave*0.01);
    if (Math.random()<dropChance) drops.push({x:e.x,y:e.y,type:'hp',pulse:0});
    else if (Math.random()<0.12)  drops.push({x:e.x,y:e.y,type:'mp',pulse:0});
}

function levelUp() {
    P.lv++;
    P.exp-=P.nextExp;
    P.nextExp=Math.floor(P.nextExp*1.4);
    pickLvlChoices();
    state=ST.LVLUP;
    playSound(880,'sine',0.45,0.45);
    setTimeout(()=>playSound(1100,'sine',0.35,0.38),100);
}

// ============================================================
//  EFFECTS
// ============================================================
function addParts(x,y,color,n) {
    for (let i=0;i<n;i++) {
        let a=Math.random()*Math.PI*2, s=55+Math.random()*110;
        particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
            life:0.4+Math.random()*0.3, max:0.4+Math.random()*0.3, color, sz:2+Math.random()*4 });
    }
}
function addFloat(x,y,txt,color,fs) {
    floats.push({x,y,txt:''+txt,color,fs,life:1.1,vy:-55-Math.random()*20});
}

// ============================================================
//  MOVE HELPER
// ============================================================
function moveEnt(ent,vx,vy,dt) {
    let hw=ent.w/2, hh=ent.h/2-6;
    let nx=ent.x+vx*dt, ny=ent.y+vy*dt;
    if (!solidW(nx-hw,ent.y) && !solidW(nx+hw,ent.y)) ent.x=nx;
    if (!solidW(ent.x,ny-hh) && !solidW(ent.x,ny+hh)) ent.y=ny;
}

function dist(ax,ay,bx,by) { let dx=ax-bx,dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }

// ============================================================
//  UPDATE
// ============================================================
function update(dt) {
    if (state===ST.WAVE_INTRO) {
        waveIntroTimer -= dt;
        if (waveIntroTimer <= 0) {
            state = ST.PLAY;
            spawnWave(wave);
        }
        return;
    }
    if (state!==ST.PLAY) return;

    // Player movement
    let mvx=joy.dx, mvy=joy.dy;
    if (keys['ArrowLeft']||keys['a']) mvx-=1;
    if (keys['ArrowRight']||keys['d']) mvx+=1;
    if (keys['ArrowUp']||keys['w'])   mvy-=1;
    if (keys['ArrowDown']||keys['s']) mvy+=1;
    let ml=Math.sqrt(mvx*mvx+mvy*mvy);
    if (ml>0) { mvx/=ml; mvy/=ml; moveEnt(P,mvx*P.spd,mvy*P.spd,dt); }

    P.x=Math.max(TILE,Math.min((MAP_W-1)*TILE,P.x));
    P.y=Math.max(TILE,Math.min((MAP_H-1)*TILE,P.y));

    camX=Math.max(0,Math.min(MAP_W*TILE-W,P.x-W/2));
    camY=Math.max(0,Math.min(MAP_H*TILE-H,P.y-H/2));

    // Cooldowns
    P.atkCD   = Math.max(0,P.atkCD-dt);
    P.s1CD    = Math.max(0,P.s1CD-dt);
    P.s2CD    = Math.max(0,P.s2CD-dt);
    P.iframes = Math.max(0,P.iframes-dt);
    P.mp      = Math.min(P.maxMp, P.mp+dt*P.mpRegen);
    if (P.hpRegen>0) P.hp = Math.min(P.maxHp, P.hp+dt*P.hpRegen);

    // Auto-attack nearest
    if (P.atkCD<=0 && !P.dead) {
        let near=null, nearD=P.atkRange+50;
        for (let e of enemies) {
            if (e.hp<=0) continue;
            let d=dist(P.x,P.y,e.x,e.y);
            if (d<nearD) { nearD=d; near=e; }
        }
        if (near) doAttack();
    }

    // Enemies
    for (let i=enemies.length-1; i>=0; i--) {
        let e=enemies[i];
        if (e.hp<=0) { enemies.splice(i,1); waveLeft--; continue; }
        e.flash   = Math.max(0,e.flash-dt);
        e.atkCD   = Math.max(0,e.atkCD-dt);
        e.stunned = Math.max(0,e.stunned-dt);
        e.slowed  = Math.max(0,e.slowed-dt);

        if (e.stunned>0) {
            // Skip movement and attack while stunned
            for (let j=0;j<enemies.length;j++) {
                if (i===j) continue;
                let o=enemies[j],edx=e.x-o.x,edy=e.y-o.y;
                let ed=Math.sqrt(edx*edx+edy*edy);
                if (ed<26&&ed>0){e.x+=edx/ed*18*dt;e.y+=edy/ed*18*dt;}
            }
            continue;
        }

        let dx=P.x-e.x, dy=P.y-e.y, d=dist(P.x,P.y,e.x,e.y);
        let spdMult = e.slowed>0 ? 0.3 : 1.0;

        if (e.ranged && d<e.rDist && d>80) {
            e.shootCD-=dt;
            if (e.shootCD<=0) {
                e.shootCD=e.rCD;
                let a=Math.atan2(dy,dx);
                bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,
                    dmg:e.atk,life:2.2,enemy:true,color:'#88ff44',pierce:false,hitList:[]});
                playSound(280,'square',0.04,0.08);
            }
        } else {
            let nx=dx/d, ny=dy/d;
            moveEnt(e,nx*e.spd*spdMult,ny*e.spd*spdMult,dt);
        }

        // Melee
        if (d<36+e.w/2 && e.atkCD<=0 && P.iframes<=0 && !P.dead) {
            e.atkCD=1.4;
            let dmg=Math.max(1,e.atk-P.def);
            P.hp-=dmg; P.iframes=0.42;
            addParts(P.x,P.y,'#ff3344',5);
            addFloat(P.x,P.y-10,dmg,'#ff4444',14);
            playSound(140,'sawtooth',0.09,0.28);
            if (P.hp<=0) {
                P.hp=0; P.dead=true;
                stopAmbient();
                playSound(70,'sawtooth',0.9,0.5);
                setTimeout(()=>{ gameOver(); },1600);
            }
        }

        // Separation
        for (let j=0;j<enemies.length;j++) {
            if (i===j) continue;
            let o=enemies[j],edx=e.x-o.x,edy=e.y-o.y;
            let ed=Math.sqrt(edx*edx+edy*edy);
            if (ed<26&&ed>0){e.x+=edx/ed*18*dt;e.y+=edy/ed*18*dt;}
        }
    }

    // Bullets
    for (let i=bullets.length-1;i>=0;i--) {
        let b=bullets[i];
        b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
        if (b.life<=0||solidW(b.x,b.y)) { addParts(b.x,b.y,b.color,3); bullets.splice(i,1); continue; }
        if (b.enemy) {
            if (P.iframes<=0 && !P.dead && dist(b.x,b.y,P.x,P.y)<20) {
                let dmg=Math.max(1,b.dmg-P.def);
                P.hp-=dmg; P.iframes=0.32;
                addFloat(P.x,P.y-10,dmg,'#ff4444',14);
                addParts(P.x,P.y,'#ff3344',4);
                bullets.splice(i,1);
                if (P.hp<=0){P.hp=0;P.dead=true;stopAmbient();setTimeout(()=>gameOver(),1600);}
            }
        } else {
            // Player bullet
            let removed=false;
            for (let j=enemies.length-1;j>=0;j--) {
                let e=enemies[j];
                if (e.hp<=0) continue;
                if (b.hitList && b.hitList.includes(j)) continue;
                if (dist(b.x,b.y,e.x,e.y)<e.w/2+6) {
                    let dmg=b.dmg+Math.floor(Math.random()*8);
                    let crit=Math.random()<P.crit;
                    if (crit) dmg=Math.floor(dmg*1.85);
                    e.hp-=dmg; e.flash=0.12;
                    addParts(e.x,e.y,crit?'#ffcc00':'#ff3344',crit?8:4);
                    addFloat(e.x,e.y-15,dmg,crit?'#ffcc00':'#ffffff',crit?18:14);
                    if (e.hp<=0) killEnemy(e);
                    if (b.pierce) {
                        b.hitList.push(j);
                    } else {
                        bullets.splice(i,1); removed=true; break;
                    }
                }
            }
        }
    }

    // Particles
    for (let i=particles.length-1;i>=0;i--) {
        let p=particles[i];
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        p.vx*=0.88; p.vy*=0.88;
        p.life-=dt; if(p.life<=0) particles.splice(i,1);
    }

    // Floats
    for (let i=floats.length-1;i>=0;i--) {
        let f=floats[i];
        f.y+=f.vy*dt; f.vy*=0.88; f.life-=dt;
        if(f.life<=0) floats.splice(i,1);
    }

    // Drops
    for (let i=drops.length-1;i>=0;i--) {
        let d=drops[i]; d.pulse+=dt*3;
        if (dist(d.x,d.y,P.x,P.y)<26) {
            if (d.type==='hp') {
                let h=35+P.lv*6; P.hp=Math.min(P.maxHp,P.hp+h);
                addFloat(P.x,P.y-20,'+'+h,'#44ff66',16);
                playSound(660,'sine',0.12,0.25);
            } else {
                P.mp=Math.min(P.maxMp,P.mp+45);
                addFloat(P.x,P.y-20,'+MP','#4488ff',16);
            }
            drops.splice(i,1);
        }
    }

    // Wave progression
    if (enemies.length===0 && waveLeft<=0 && !waveSpawned) {
        waveTimer-=dt;
        if (waveTimer<=0) {
            wave++;
            waveSpawned=true;
            genMap(); // Regenerate map every wave
            waveIntroTypes = getWaveEnemyTypes(wave);
            waveIntroTimer = 2.5;
            state = ST.WAVE_INTRO;
            waveSpawned=false;
            waveTimer=3;
        }
    }
}

function gameOver() {
    // Save high score
    if (score > highScore) { highScore=score; localStorage.setItem('rz_hs',''+score); }
    if (wave  > bestWave)  { bestWave=wave;   localStorage.setItem('rz_bw',''+wave); }
    state=ST.OVER;
}

// ============================================================
//  RENDER EFFECTS
// ============================================================
function renderParts() {
    for (let p of particles) {
        let a=p.life/p.max;
        ctx.globalAlpha=a; ctx.fillStyle=p.color;
        ctx.fillRect(p.x-camX-p.sz/2,p.y-camY-p.sz/2,p.sz,p.sz);
    }
    ctx.globalAlpha=1;
}

function renderFloats() {
    ctx.textAlign='center';
    for (let f of floats) {
        let a=Math.min(1,f.life*1.8);
        ctx.globalAlpha=a;
        ctx.font=`bold ${f.fs}px sans-serif`;
        ctx.fillStyle='#000'; ctx.fillText(f.txt,f.x-camX+1,f.y-camY+1);
        ctx.fillStyle=f.color; ctx.fillText(f.txt,f.x-camX,f.y-camY);
    }
    ctx.globalAlpha=1;
}

function renderDrops() {
    for (let d of drops) {
        let sx=d.x-camX,sy=d.y-camY,p=Math.sin(d.pulse)*3;
        if (d.type==='hp') {
            ctx.fillStyle='#ff2244'; ctx.beginPath(); ctx.arc(sx,sy+p,11,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#ff88aa'; ctx.beginPath(); ctx.arc(sx-3,sy-3+p,4,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#fff'; ctx.fillRect(sx-1,sy-6+p,2,12); ctx.fillRect(sx-6,sy-1+p,12,2);
        } else {
            ctx.fillStyle='#2244ff'; ctx.beginPath(); ctx.arc(sx,sy+p,11,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#88aaff'; ctx.beginPath(); ctx.arc(sx-3,sy-3+p,4,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.fillText('M',sx,sy+3+p);
        }
    }
}

function renderBullets() {
    for (let b of bullets) {
        let sx=b.x-camX,sy=b.y-camY;
        ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(sx,sy,b.pierce?7:5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=b.color+'88'; ctx.beginPath();
        ctx.arc(sx-b.vx*0.025,sy-b.vy*0.025,b.pierce?5:3.5,0,Math.PI*2); ctx.fill();
    }
}

// ============================================================
//  HUD
// ============================================================
function rRect(x,y,w,h,r) {
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

    ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.fillText('⏸',px2,py2+6);

    // Vignette

function drawClassSelect() {
    ctx.fillStyle='#080410'; ctx.fillRect(0,0,W,H);

        let sx=(i*97.3)%W, sy=(i*131.7)%H;

    }

    ctx.shadowColor='#8844ff'; ctx.shadowBlur=20;
    ctx.fillStyle='#ffcc00'; ctx.font=`bold ${Math.min(32,W*0.08)}px serif`;
    ctx.textAlign='center'; ctx.fillText('⚔ เลือกอาชีพ',W/2,H*0.1);
    ctx.shadowBlur=0;

    const clsKeys = ['knight','mage','archer'];
    const cardH = Math.min(140, (H*0.72)/3 - 12);
    const cardW = Math.min(340, W*0.88);
    const startY = H*0.16;
    classCardRects = [];

    clsKeys.forEach((key, idx) => {
        let cls = CLASSES[key];
        let cx = W/2 - cardW/2;
        let cy = startY + idx*(cardH+12);
        classCardRects.push({x:cx,y:cy,w:cardW,h:cardH});

        let isSelected = selectedClass===key;
        // Card background
        ctx.fillStyle = isSelected ? 'rgba(100,50,180,0.9)' : 'rgba(20,10,40,0.85)';
        rRect(cx,cy,cardW,cardH,12); ctx.fill();
        ctx.strokeStyle = isSelected ? '#ffcc00' : '#442266';
        ctx.lineWidth = isSelected ? 3 : 1.5; ctx.stroke();

        if (isSelected) {
            ctx.shadowColor='#ffcc00'; ctx.shadowBlur=15;
            rRect(cx,cy,cardW,cardH,12); ctx.stroke();
            ctx.shadowBlur=0;
        }

        // Icon
        ctx.font=`${Math.min(36,cardH*0.3)}px sans-serif`; ctx.textAlign='center';
        ctx.fillText(cls.icon, cx+40, cy+cardH/2+10);

        // Class name
        ctx.fillStyle = isSelected ? '#ffcc00' : '#ccaaff';
        ctx.font=`bold ${Math.min(20,cardH*0.16)}px sans-serif`; ctx.textAlign='left';
        ctx.fillText(cls.label, cx+70, cy+cardH*0.28);

        ctx.fillText(`Skill1: ${cls.s1name}  |  Skill2: ${cls.s2name} (Lv5)`, cx+70, cy+cardH*0.68);

        if (isSelected) {
            ctx.fillStyle='#ffcc00'; ctx.font='bold 14px sans-serif'; ctx.textAlign='right';
            ctx.fillText('✓ เลือก', cx+cardW-14, cy+cardH-12);

    });

    // Start button
    let bW2=Math.min(220,W*0.58),bH2=54,bX2=W/2-bW2/2,bY2=startY+3*(cardH+12)+10;

    ctx.strokeStyle='#334466'; ctx.lineWidth=2; ctx.stroke();

    ctx.fillStyle='#ccc'; ctx.font='14px sans-serif'; ctx.textAlign='center';
    ctx.fillText(`Wave ${wave}  •  Score: ${score}`,W/2,H*0.36+38);
    ctx.fillText(`Level ${P.lv}  •  Kills: ${totalKills}`,W/2,H*0.36+62);

    // Resume button
    let rW=200,rH=48,rX=W/2-100,rY=H*0.36+80;
    let rg=ctx.createLinearGradient(rX,rY,rX+rW,rY+rH);
    rg.addColorStop(0,'#1a3366'); rg.addColorStop(1,'#2244aa');
    ctx.fillStyle=rg; rRect(rX,rY,rW,rH,10); ctx.fill();
    ctx.strokeStyle='#4488ff'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
    ctx.fillText('▶ Resume',W/2,rY+32);

    // Main menu button
    let mY=rY+58;
    ctx.fillStyle='rgba(60,20,20,0.85)'; rRect(rX,mY,rW,rH,10); ctx.fill();
    ctx.strokeStyle='#884444'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#ff8888'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🏠 Main Menu',W/2,mY+32);
}

// ============================================================
//  WAVE INTRO OVERLAY
// ============================================================
function drawWaveIntro() {
    let progress = 1 - (waveIntroTimer / 2.5);
    ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);

    let alpha = Math.min(1, progress*3);
    ctx.globalAlpha = alpha;

    ctx.shadowColor='#ff4400'; ctx.shadowBlur=30;
    ctx.fillStyle='#ff6622'; ctx.font=`bold ${Math.min(42,W*0.1)}px serif`;
    ctx.textAlign='center'; ctx.fillText(`WAVE ${wave} INCOMING!`,W/2,H*0.34);
    ctx.shadowBlur=0;

    ctx.fillStyle='rgba(20,10,30,0.9)'; rRect(W/2-160,H*0.42,320,100,12); ctx.fill();
    ctx.strokeStyle='#662222'; ctx.lineWidth=2; ctx.stroke();

    ctx.fillStyle='#ff9966'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Enemy types:',W/2,H*0.42+26);
    ctx.fillStyle='#ffccaa'; ctx.font='12px sans-serif';
    waveIntroTypes.forEach((name,i)=>{
        ctx.fillText(`• ${name}`,W/2,H*0.42+46+i*18);
    });

    // Countdown bar
    let barW = Math.min(300,W*0.8);
    let barX = W/2-barW/2;
    let barY = H*0.64;
    ctx.fillStyle='#220a0a'; rRect(barX,barY,barW,16,6); ctx.fill();
    ctx.fillStyle='#cc3300'; rRect(barX,barY,barW*progress,16,6); ctx.fill();
    ctx.fillStyle='#ff8844'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(`${Math.ceil(waveIntroTimer)}s`,W/2,barY+30);

    ctx.globalAlpha=1;
}

// ============================================================
//  LEVEL UP CARDS
// ============================================================
function drawLevelUp() {
    ctx.fillStyle='rgba(0,0,20,0.92)'; ctx.fillRect(0,0,W,H);
    ctx.shadowColor='#ffcc00'; ctx.shadowBlur=45;
    ctx.fillStyle='#ffdd00'; ctx.font=`bold ${Math.min(44,W*0.11)}px serif`;
    ctx.textAlign='center'; ctx.fillText('✨ LEVEL UP! ✨',W/2,H*0.1);
    ctx.shadowBlur=0;
    ctx.fillStyle='#aaddff'; ctx.font=`bold ${Math.min(24,W*0.06)}px serif`;
    ctx.fillText(`Level ${P.lv} — เลือก 1 รางวัล`,W/2,H*0.19);

    const cardW = Math.min(320,W*0.84);
    const cardH = Math.min(90, (H*0.6)/3 - 14);
    const startY = H*0.24;
    lvlCardRects = [];

    lvlChoices.forEach((choice, idx) => {
        let cx = W/2 - cardW/2;
        let cy = startY + idx*(cardH+14);
        lvlCardRects.push({x:cx,y:cy,w:cardW,h:cardH});

        // Card glow on hover (just draw nice cards)
        let grad=ctx.createLinearGradient(cx,cy,cx+cardW,cy+cardH);
        grad.addColorStop(0,'rgba(40,20,80,0.95)');
        grad.addColorStop(1,'rgba(20,10,50,0.95)');
        ctx.fillStyle=grad; rRect(cx,cy,cardW,cardH,12); ctx.fill();
        ctx.strokeStyle='#7744aa'; ctx.lineWidth=2; ctx.stroke();

        // Name
        ctx.fillStyle='#ffdd66'; ctx.font=`bold ${Math.min(18,cardH*0.22)}px sans-serif`;
        ctx.textAlign='center'; ctx.fillText(choice.name,W/2,cy+cardH*0.42);
        // Desc
        ctx.fillStyle='#ccbbee'; ctx.font=`${Math.min(13,cardH*0.16)}px sans-serif`;
        ctx.fillText(choice.desc,W/2,cy+cardH*0.7);
    });

    ctx.fillStyle='rgba(200,200,255,0.5)'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('แตะการ์ดเพื่อเลือก',W/2,startY+3*(cardH+14)+16);
}

// ============================================================
//  GAME OVER SCREEN
// ============================================================
function drawGameOver() {
    ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,W,H);
    ctx.shadowColor='#ff0000'; ctx.shadowBlur=35;
    ctx.fillStyle='#ff2244'; ctx.font=`bold ${Math.min(50,W*0.125)}px serif`;
    ctx.textAlign='center'; ctx.fillText('💀 GAME OVER 💀',W/2,H*0.24);
    ctx.shadowBlur=0;

    ctx.fillStyle='rgba(0,0,0,0.75)'; rRect(W/2-155,H*0.32,310,210,14); ctx.fill();
    ctx.strokeStyle='#552266'; ctx.lineWidth=2; ctx.stroke();

    ctx.fillStyle='#ffcc00'; ctx.font='bold 17px sans-serif';
    ctx.fillText('— สรุปผลการต่อสู้ —',W/2,H*0.32+30);

    ctx.font='15px sans-serif'; ctx.fillStyle='#fff';
    let lines=[
        `🌊 Wave ที่รอดได้: ${wave}`,
        `☠ ฆ่าสัตว์: ${totalKills} ตัว`,
        `⭐ คะแนน: ${score}`,
        `🏆 Level สูงสุด: ${P.lv}`,
    ];
    lines.forEach((l,i)=>ctx.fillText(l,W/2,H*0.32+62+i*26));

    // High score info
    let isNewHS = score>=highScore;
    let isNewBW = wave>=bestWave;
    ctx.fillStyle=isNewHS?'#ffee44':'#888';
    ctx.font='bold 13px sans-serif';
    ctx.fillText(isNewHS?`🏆 NEW BEST! ${score} pts`:`🏆 Best Score: ${highScore}`,W/2,H*0.32+168);
    if (isNewBW) {
        ctx.fillStyle='#ff8844'; ctx.font='bold 12px sans-serif';
        ctx.fillText(`🌊 NEW BEST WAVE! ${wave}`,W/2,H*0.32+188);
    }

    let bY=H*0.78,bW=190,bH=55;
    ctx.shadowColor='#ffcc00'; ctx.shadowBlur=12;
    ctx.fillStyle='#4a1188'; rRect(W/2-bW/2,bY,bW,bH,12); ctx.fill();
    ctx.strokeStyle='#ffcc00'; ctx.lineWidth=2; ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif';
    ctx.fillText('🔄 เล่นใหม่',W/2,bY+36);
}

// ============================================================
//  INPUT
// ============================================================
const joy = { on:false, id:-1, cx:0, cy:0, dx:0, dy:0, r:58 };
const keys = {};

function onTouchStart(e) {
    e.preventDefault();
    initAudio();
    if (audioCtx && audioCtx.state==='suspended') audioCtx.resume();

    for (let t of e.changedTouches) {
        let x=t.clientX, y=t.clientY;
        handlePointerDown(x, y, t.identifier);
    }
}

function handlePointerDown(x, y, id) {
    if (state===ST.MENU) { toClassSelect(); return; }
    if (state===ST.OVER) { toClassSelect(); return; }

    if (state===ST.CLASS) {
        // Check class cards
        for (let i=0;i<classCardRects.length;i++) {
            let r=classCardRects[i];
            if (x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) {
                selectedClass=['knight','mage','archer'][i];
                return;
            }
        }
        // Check start button
        const clsKeys=['knight','mage','archer'];
        const cardH=Math.min(140,(H*0.72)/3-12);
        const startY=H*0.16;
        let bY2=startY+3*(cardH+12)+10, bH2=54;
        let bW2=Math.min(220,W*0.58), bX2=W/2-bW2/2;
        if (x>=bX2&&x<=bX2+bW2&&y>=bY2&&y<=bY2+bH2) {
            startGame(selectedClass);
        }
        return;
    }

    if (state===ST.LVLUP) {
        for (let i=0;i<lvlCardRects.length;i++) {
            let r=lvlCardRects[i];
            if (x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) {
                lvlChoices[i].fn();
                state=ST.PLAY;
                playSound(550,'sine',0.15,0.2);
                return;
            }
        }
        return;
    }

    if (state===ST.WAVE_INTRO) return;

    if (state===ST.PAUSE) {
        // Resume button area
        let rW=200,rX=W/2-100;
        let rY_pause=H*0.36+80, rH_pause=48;
        let mY_pause=rY_pause+58;
        if (x>=rX&&x<=rX+rW&&y>=rY_pause&&y<=rY_pause+rH_pause) {
            togglePause(); return;
        }
        if (x>=rX&&x<=rX+rW&&y>=mY_pause&&y<=mY_pause+rH_pause) {
            stopAmbient(); state=ST.MENU; return;
        }
        return;
    }

    if (state===ST.PLAY) {
        // Left half: joystick
        if (x < W/2) {
            joy.on=true; joy.id=id||0; joy.cx=x; joy.cy=y; joy.dx=0; joy.dy=0;
            return;
        }
        // Right half: button priority
        // 1. Pause button (W-28, 28), r=20
        let pd = dist(x,y,W-28,28);
        if (pd < 30) { togglePause(); return; }

        // 2. Skill2 (W-88, H-250), r=32 — only if Lv>=5
        let s2d = dist(x,y,W-88,H-250);
        if (s2d < 42 && P.lv >= 5) { doSkill2(); return; }

        // 3. Skill1 (W-88, H-145), r=44
        let s1d = dist(x,y,W-88,H-145);
        if (s1d < 54) { doSkill1(); return; }

        // 4. ATK or general right-side tap
        doAttack();
    }
}

function togglePause() {
    if (state===ST.PLAY) {
        state=ST.PAUSE;
        pauseAmbient();
    } else if (state===ST.PAUSE) {
        state=ST.PLAY;
        resumeAmbient();
    }
}

function onTouchMove(e) {
    e.preventDefault();
    for (let t of e.changedTouches) {
        if (t.identifier===joy.id) {
            let dx=t.clientX-joy.cx, dy=t.clientY-joy.cy;
            let d=Math.sqrt(dx*dx+dy*dy);
            if (d>joy.r){dx=dx/d*joy.r;dy=dy/d*joy.r;}
            joy.dx=dx/joy.r; joy.dy=dy/joy.r;
        }
    }
}

function onTouchEnd(e) {
    e.preventDefault();
    for (let t of e.changedTouches) {
        if (t.identifier===joy.id){joy.on=false;joy.id=-1;joy.dx=0;joy.dy=0;}
    }
}

canvas.addEventListener('touchstart', onTouchStart,  {passive:false});
canvas.addEventListener('touchmove',  onTouchMove,   {passive:false});
canvas.addEventListener('touchend',   onTouchEnd,    {passive:false});
canvas.addEventListener('touchcancel',onTouchEnd,    {passive:false});

// Mouse
canvas.addEventListener('mousedown', e=>{
    initAudio();
    handlePointerDown(e.clientX, e.clientY, 0);
    if (state===ST.PLAY && e.clientX<W/2) {
        joy.on=true; joy.cx=e.clientX; joy.cy=e.clientY; joy.dx=0; joy.dy=0;
    }
});
canvas.addEventListener('mousemove', e=>{
    if (!joy.on) return;
    let dx=e.clientX-joy.cx, dy=e.clientY-joy.cy;
    let d=Math.sqrt(dx*dx+dy*dy); if(d>joy.r){dx=dx/d*joy.r;dy=dy/d*joy.r;}
    joy.dx=dx/joy.r; joy.dy=dy/joy.r;
});
canvas.addEventListener('mouseup', ()=>{joy.on=false;joy.dx=0;joy.dy=0;});

// Keyboard
window.addEventListener('keydown', e=>{
    keys[e.key]=true;
    initAudio();
    if (e.key==='Escape'||(e.key==='p'||e.key==='P')) {
        if (state===ST.PLAY||state===ST.PAUSE) togglePause();
    }
    if (state===ST.MENU&&e.key==='Enter') toClassSelect();
    if (state===ST.OVER&&e.key==='Enter') toClassSelect();
    if (state===ST.PLAY) {
        if (e.key===' '||e.key==='z') doSkill1();
        if (e.key==='x') doAttack();
        if (e.key==='c') doSkill2();
    }
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

setInterval(()=>{
    if (state!==ST.PLAY) return;
    let dx=0,dy=0;
    if(keys['ArrowLeft']||keys['a']) dx-=1;
    if(keys['ArrowRight']||keys['d']) dx+=1;
    if(keys['ArrowUp']||keys['w']) dy-=1;
    if(keys['ArrowDown']||keys['s']) dy+=1;
    if ((dx!==0||dy!==0)&&!joy.on) {
        let l=Math.sqrt(dx*dx+dy*dy); joy.dx=dx/l; joy.dy=dy/l; joy.on=true;
    } else if (!joy.on) { joy.dx=0; joy.dy=0; }
},16);

window.addEventListener('resize',()=>{
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W; canvas.height=H;
});

// ============================================================
//  GAME MANAGEMENT
// ============================================================
function toClassSelect() {
    state = ST.CLASS;
}

function startGame(cls) {
    selectedClass = cls || 'knight';
    let clsCfg = CLASSES[selectedClass];

    state=ST.PLAY;
    wave=1; score=0; totalKills=0; waveLeft=0; waveTimer=3;
    enemies=[]; bullets=[]; particles=[]; floats=[]; drops=[];
    waveSpawned=false;

    // Reset player from class config
    P.cls = selectedClass;
    P.x = MAP_W*TILE/2; P.y = MAP_H*TILE/2;
    P.hp = clsCfg.hp; P.maxHp = clsCfg.hp;
    P.mp = clsCfg.mp; P.maxMp = clsCfg.mp;
    P.atk = clsCfg.atk; P.def = clsCfg.def; P.spd = clsCfg.spd;
    P.crit = clsCfg.crit;
    P.s1BaseCd = clsCfg.s1cd; P.s1CD = 0;
    P.s2BaseCd = clsCfg.s2cd; P.s2CD = 0;
    P.atkCD = 0; P.iframes = 0; P.dead = false;
    P.exp = 0; P.nextExp = 100; P.lv = 1;
    P.hpRegen = 0; P.mpRegen = 6;
    P.atkRange = 75;

    genMap();
    camX=P.x-W/2; camY=P.y-H/2;

    startAmbient();

    // Show wave intro for wave 1
    waveIntroTypes = getWaveEnemyTypes(1);
    waveIntroTimer = 2.5;
    state = ST.WAVE_INTRO;
}

// ============================================================
//  MAIN LOOP
// ============================================================
function loop(ts) {
    let dt = Math.min((ts-lastT)/1000, 0.05); lastT=ts;
    ctx.clearRect(0,0,W,H);

    if (state===ST.MENU) {
        drawMenu();
    } else if (state===ST.CLASS) {
        drawClassSelect();
    } else if (state===ST.OVER) {
        drawTiles();
        renderDrops(); renderBullets();
        enemies.forEach(e=>drawEnemy(e));
        drawPlayer();
        renderParts(); renderFloats();
        drawGameOver();
    } else if (state===ST.WAVE_INTRO) {
        update(dt);
        drawTiles();
        renderDrops(); renderBullets();
        enemies.sort((a,b)=>a.y-b.y).forEach(e=>drawEnemy(e));
        drawPlayer();
        renderParts(); renderFloats();
        drawHUD();
        drawWaveIntro();
    } else if (state===ST.PAUSE) {
        drawTiles();
        renderDrops(); renderBullets();
        enemies.sort((a,b)=>a.y-b.y).forEach(e=>drawEnemy(e));
        drawPlayer();
        renderParts(); renderFloats();
        drawHUD();
        drawPause();
    } else {
        // PLAY or LVLUP
        update(dt);
        drawTiles();
        renderDrops(); renderBullets();
        enemies.sort((a,b)=>a.y-b.y).forEach(e=>drawEnemy(e));
        drawPlayer();
        renderParts(); renderFloats();
        drawHUD();
        if (state===ST.LVLUP) drawLevelUp();
    }

    requestAnimationFrame(loop);
}

// ============================================================
//  INIT
// ============================================================
genMap();
requestAnimationFrame(loop);
</script>
